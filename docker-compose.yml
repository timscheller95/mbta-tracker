services:

  # ── MBTA polling service ────────────────────────────────────────────────────
  tracker:
    build: ./tracker
    restart: unless-stopped
    environment:
      MBTA_API_KEY: ${MBTA_API_KEY:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: mbta-orange-line-tracker
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - mbta

  # ── OpenTelemetry Collector (Contrib) ───────────────────────────────────────
  # Receives OTLP from the tracker and dual-ships to Prometheus + Datadog.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC  (for direct use or other services)
      - "4318:4318"    # OTLP HTTP
      - "8889:8889"    # Prometheus metrics endpoint (scraped by Prometheus)
      - "13133:13133"  # Health check
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
    networks:
      - mbta

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - mbta

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-mbta-tracker}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mbta

volumes:
  prometheus_data:
  grafana_data:

networks:
  mbta:
    name: mbta-tracker
