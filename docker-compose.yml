services:
  mbta-monitor:
    build: ./tracker
    restart: always
    # host network gives the container direct access to localhost — required so the
    # OTLP exporter can reach the Datadog Agent's HTTP receiver on port 4318.
    network_mode: host
    env_file: .env
    environment:
      NTFY_TOPIC_1: ${NTFY_TOPIC_1}
      NTFY_TOPIC_2: ${NTFY_TOPIC_2}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      DELAY_THRESHOLD_SECONDS: ${DELAY_THRESHOLD_SECONDS:-600}
      DD_SERVICE: mbta-commute-monitor
      DD_ENV: production
