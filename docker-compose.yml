services:
  mbta-monitor:
    build: ./tracker
    restart: always        # auto-starts when Docker daemon starts (i.e. on every reboot)
    env_file: .env
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    # If cross-compiling on an x86 machine, uncomment the line below.
    # When building directly on the Pi Zero, leave it commented out.
    # platform: linux/arm/v6
