# OpenTelemetry Collector configuration
# Receives OTLP from the tracker service and exports to:
#   1. Prometheus (scraped by the Prometheus server → Grafana)   [always on]
#   2. Datadog (direct API export)                               [opt-in, see below]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Guard against memory spikes before batching
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Enrich all telemetry with a consistent environment attribute
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment
        action: upsert

exporters:
  # ── Prometheus ──────────────────────────────────────────────────────────────
  # Exposes /metrics on :8889 — scraped by the Prometheus server.
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    # Expire metric series that haven't been updated for 5 minutes
    metric_expiration: 5m
    enable_open_metrics: true
    # Appends unit suffixes (_seconds, _total, _bytes, etc.)
    add_metric_suffixes: true
    # Promote resource attributes (service.name, etc.) to Prometheus labels
    resource_to_telemetry_conversion:
      enabled: true

  # ── Datadog (optional) ──────────────────────────────────────────────────────
  # To enable: uncomment this block, set DD_API_KEY in .env, then uncomment
  # "datadog" in each pipeline's exporters list below.
  #
  # datadog:
  #   api:
  #     key: ${DD_API_KEY}
  #     site: ${DD_SITE}
  #   metrics:
  #     histograms:
  #       mode: distributions
  #       send_count_sum_metrics: true
  #     sums:
  #       cumulative_monotonic_mode: to_delta
  #   traces:
  #     span_name_as_resource_name: true
  #     compute_stats_by_span_kind: true
  #   host_metadata:
  #     enabled: false

  # ── Debug (stdout) ──────────────────────────────────────────────────────────
  # Logs a sample of received telemetry — useful during development.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

service:
  extensions: [health_check, pprof]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
      # To add Datadog: exporters: [datadog, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
      # To add Datadog: exporters: [prometheus, datadog, debug]

  telemetry:
    logs:
      level: info
    metrics:
      # Collector self-metrics exposed on :8888 (scraped by the otel-collector-self job)
      address: 0.0.0.0:8888
