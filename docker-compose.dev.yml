services:
  test:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./tracker:/app
    environment:
      NTFY_TOPIC_1: test-topic-1
      NTFY_TOPIC_2: test-topic-2
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    command: >
      bash -c "pip install -q -r requirements-dev.txt &&
               pytest tests/test_integration.py -v"
